name: Push to release branches

on:
  push:
    branches:
      - main

jobs:
  Build-Push-Docker-Hub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        composer-version: [2.8.5, 2.10.2]
        debian-version: [bookworm]
        php-version: [8.2.27, 8.2.33]
        server: [apache, fpm]
      fail-fast: false
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU to provide multiple architectures
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx to build for multiple architectures
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-architecture images
        uses: docker/build-push-action@v6
        with:
          build-args: |
            DEBIAN_VERSION=${{ matrix.debian-version }}
            PHP_VERSION=${{ matrix.php-version }}
            COMPOSER_VERSION=${{ matrix.composer-version }}
            SERVER=${{ matrix.server }}
          platforms: linux/amd64
          push: true
          tags: voquis/cakephp:${{ matrix.php-version }}-${{ matrix.server }}-${{ matrix.debian-version }}
